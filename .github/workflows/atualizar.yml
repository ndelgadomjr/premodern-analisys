name: Atualizar precos e publicar painel

on:
  schedule:
    - cron: "17 12 * * *"      # todo dia as 09:17 (horario de Brasilia)
  workflow_dispatch:           # permite rodar na mao pelo botao "Run workflow"

permissions:
  contents: write              # guardar o historico (Release) e a data da ultima execucao
  pages: write                 # publicar a pagina
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ijson
        run: pip install ijson

      - name: Recuperar historico salvo
        run: |
          gh release download dados --pattern "premodern.db*" --dir . || echo "Ainda nao existe historico salvo (primeira execucao)."
          if [ -f premodern.db.gz ]; then gunzip -f premodern.db.gz; fi
          ls -la

      - name: Atualizar precos e gerar painel
        run: python atualizar.py --sem-abrir

      - name: Salvar historico
        run: |
          gzip -kf premodern.db
          gh release view dados >/dev/null 2>&1 || gh release create dados --title "Dados" --notes "Banco de precos, atualizado automaticamente."
          gh release upload dados premodern.db.gz --clobber
          gh release delete-asset dados premodern.db --yes >/dev/null 2>&1 || true

      - name: Manter o agendamento ativo
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            date -u +%F > ultima_execucao.txt
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add ultima_execucao.txt
            git commit -m "Registra ultima execucao" || true
            git push || true
          fi

      - name: Preparar o site
        run: |
          mkdir site
          cp painel.html site/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Guardar o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: atualizar.log
          if-no-files-found: ignore
